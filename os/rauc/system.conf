# RAUC configuration - A/B redundant root filesystem on the CFB.
# Bootloader: U-Boot (or the Raspberry Pi tryboot mechanism) with boot counter.
[system]
compatible=CFB-HW-100
bootloader=uboot
bundle-formats=-plain
statusfile=/data/rauc.status
max-bundle-download-size=536870912

[keyring]
path=/etc/rauc/ca.cert.pem
# Bundles must be signed by the design organisation's release CA.
check-crl=true

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
