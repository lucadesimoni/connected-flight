name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --release --bin cfbd -- --config config/cfb.toml --simulate
      - run: cargo run --release --bin cfbd -- --config config/cfb.toml --simulate --hard-landing
      - run: cargo run --release --bin cfbd -- --config config/cfb-minimal.toml --simulate
      - run: cargo run --release --bin cfbd -- --config config/cfb-pc12-example.toml --simulate --apps config/apps
  cross-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-aarch64
          path: |
            target/release/cfbd
            target/release/cfb-ground
