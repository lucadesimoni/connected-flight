# Connected Flight Box - installed configuration: PC-12-class turboprop (EXAMPLE)
# 5G + Starlink (LEO) + Iridium, ARINC 429 from the avionics, edge apps, OTA.
# ARINC label numbers for engine data are ILLUSTRATIVE: take every label from
# the aircraft / avionics ICD (Pilatus / Honeywell) before use.
# Lives on the read-only rootfs at /etc/cfb/cfb.toml.
# Changes only through a signed configuration update.

[aircraft]
registration  = "HB-XXX"
icao24        = "4B1234"
aircraft_type = "PC-12-class turboprop (example)"
bus_voltage   = 28            # 14 or 28

# ---------------------------------------------------------------- modules
# Hardware fitted to this unit. Checked at boot against the module ID
# EEPROMs; a link can only be enabled if its module is listed here.
[modules]
arinc429 = { channels = 2, speed = "low" }   # remove the line if not fitted
gnss     = true                             # own GNSS (reference sensor module)
imu      = true                             # own accelerometer (reference sensor module)
wifi     = true
cellular = "5g"                             # "4g", "5g" or "none"
satcom   = ["leo_sat", "iridium"]           # Starlink (Ethernet) + Iridium Certus

# ---------------------------------------------------------------- ARINC 429
# Receive only. Labels from the ICD of the source LRU (GNSS/FMS/ADC/EDU).
# Defaults are common GAMA assignments: CHECK against the actual ICD.
[arinc429]
label_reversed = false

[[arinc429.labels]]
label = "310"
param = "latitude"
format = "bnr"
range = 180.0
sig_bits = 20

[[arinc429.labels]]
label = "311"
param = "longitude"
format = "bnr"
range = 180.0
sig_bits = 20

[[arinc429.labels]]
label = "312"
param = "ground_speed"
format = "bnr"
range = 4096.0
sig_bits = 15

[[arinc429.labels]]
label = "313"
param = "track"
format = "bnr"
range = 180.0
sig_bits = 15

[[arinc429.labels]]
channel = 1                                 # air data computer on bus 2
label = "203"
param = "pressure_altitude"
format = "bnr"
range = 131072.0
sig_bits = 17

[[arinc429.labels]]
channel = 1
label = "212"
param = "altitude_rate"
format = "bnr"
range = 32768.0
sig_bits = 11

# ---- engine data (ILLUSTRATIVE labels - replace from the ICD) ----------
[[arinc429.labels]]
channel = 1
label = "346"
param = "torque"
format = "bnr"
range = 256.0
sig_bits = 14

[[arinc429.labels]]
channel = 1
label = "345"
param = "itt"
format = "bnr"
range = 2048.0
sig_bits = 14

[[arinc429.labels]]
channel = 1
label = "344"
param = "ng"
format = "bnr"
range = 256.0
sig_bits = 14

[[arinc429.labels]]
channel = 1
label = "244"
param = "fuel_flow"
format = "bnr"
range = 2048.0
sig_bits = 14

[[arinc429.labels]]
channel = 1
label = "213"
param = "oat"
format = "bnr"
range = 512.0
sig_bits = 11

# ---------------------------------------------------------------- IMU
[imu]
axes            = ["+x", "+y", "+z"]        # sensor -> aircraft (fwd, right, down)
sample_rate_hz  = 100.0
engine_vib_g    = 0.04
engine_on_s     = 5.0
engine_off_s    = 10.0
hard_landing_nz = 1.8                       # advisory only, AMM criteria apply
turbulence_dnz  = 1.0

# ---------------------------------------------------------------- reference
[reference]
arinc_max_age_s = 2.0
gnss_max_age_s  = 2.0
pos_disagree_nm = 0.5
gs_disagree_kt  = 15.0

[phase]
airborne_speed_kt  = 50.0     # set from Vs0/Vr of the type
ground_speed_kt    = 35.0
airborne_confirm_s = 5.0
ground_confirm_s   = 20.0
input_timeout_s    = 10.0

# ---------------------------------------------------------------- links
# cost_per_mb is used only to rank links against each other.

[links.wifi]
enabled             = true
ground_only         = true    # enforced by config validation
cost_per_mb         = 0.0
min_priority        = "bulk"

[links.cellular]
enabled = true
ground_only = true
cost_per_mb         = 0.01
min_priority        = "bulk"

[links.leo_sat]
enabled             = true    # Starlink terminal with an approved installation
ground_only         = false
cost_per_mb         = 2.0
min_priority        = "normal"
flight_budget_bytes = 209715200   # 200 MiB per flight

[links.iridium]
enabled             = true
ground_only         = false
cost_per_mb         = 600.0
min_priority        = "high"
flight_budget_bytes = 65536       # 64 KiB per flight, about 2000 position reports

# ---------------------------------------------------------------- queue
[queue]
max_bytes           = 268435456   # 256 MiB
snapshot_path       = "/data/cfb/queue.bin"
snapshot_interval_s = 60

[reporting]
position_interval_air_s    = 30
position_interval_ground_s = 0
position_ttl_s             = 600

# ---------------------------------------------------------------- update
[update]
hw_part_number = "CFB-HW-100"
min_supply_v   = 12.0            # 24.0 recommended for 28 V aircraft
trusted_keys   = [
  # Design organisation release key(s), hex Ed25519 public key.
  "789b1d55d02a7f1b13c7616635f496013fd40e6bd6da55f1d57dcfeb73149932",  # DEVELOPMENT key - replace for release
]

# ---------------------------------------------------------------- edge apps
[edge]
asci     = "/etc/cfb/apps-asci.toml"            # + .sig, signed by the DOA
app_dirs = ["/etc/cfb/apps", "/data/cfb/apps"]

[edge.limits]
max_outputs_per_tick = 4
max_payload          = 240
flight_bytes         = 16384
tick_budget_us       = 2000
max_overruns         = 3

# ---------------------------------------------------------------- OTA
[ota]
enabled                 = true
base_url                = "https://updates.example.invalid/cfb/CFB-HW-100"
download_dir            = "/data/updates"
inflight_download_links = ["leo_sat"]   # download (never install) over Starlink in flight
retry_s                 = 300.0

# ---------------------------------------------------------------- transport
# One WireGuard tunnel per bearer to the ground service; policy routing by
# source address keeps each tunnel on its bearer.
[transport]
ground  = "10.66.0.1:7400"
retry_s = 15

[transport.bearers.leo_sat]
local        = "10.66.4.2:0"
iface        = "wg-leo"
nominal_bps  = 20000000
keepalive_s  = 10
down_after_s = 30

[transport.bearers.iridium]
local        = "10.66.3.2:0"
iface        = "wg-iri"
nominal_bps  = 22000
keepalive_s  = 0            # metered: no idle keepalive
down_after_s = 90

[transport.bearers.cellular]
local        = "10.66.2.2:0"
iface        = "wg-cell"
nominal_bps  = 20000000
keepalive_s  = 15
down_after_s = 45

[transport.bearers.wifi]
local        = "10.66.1.2:0"
iface        = "wg-wifi"
nominal_bps  = 30000000
keepalive_s  = 15
down_after_s = 45
