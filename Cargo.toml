[workspace]
resolver = "2"
members = ["crates/cfb-core", "crates/cfb-drivers", "crates/cfbd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
authors = ["Outthinkx by Luca De Simoni <outthinkx@gmail.com>"]
publish = false
repository = "https://github.com/lucadesimoni/connected-flight"
rust-version = "1.80"

[profile.release]
opt-level = "s"        # small binary, low RAM footprint
lto = true
codegen-units = 1
panic = "unwind"       # edge apps are isolated with catch_unwind
strip = true
